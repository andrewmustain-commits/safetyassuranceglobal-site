name: Build Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate blog frontmatter governance
        run: npm run blog:validate

      - name: Static Astro diagnostics
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Validate generated links
        run: npm run validate:links

      - name: Validate generated HTML invariants
        run: npm run validate:html
