name: Build Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate blog frontmatter governance
        run: npm run blog:validate

      - name: Validate brand assets
        run: npm run validate:brand-assets

      - name: Validate Turnstile integration
        run: npm run validate:turnstile

      - name: Validate Cloudflare production configuration
        run: npm run validate:cloudflare

      - name: Static Astro diagnostics
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Compile Cloudflare Pages Functions
        run: npm run cloudflare:build-functions

      - name: Validate generated links
        run: npm run validate:links

      - name: Validate structured data
        run: npm run validate:structured-data

      - name: Validate head metadata
        run: npm run validate:head

      - name: Validate publication routes
        run: npm run validate:publication-routes

      - name: Validate sitemap integrity
        run: npm run validate:sitemap

      - name: Validate public UX
        run: npm run validate:public-ux
