name: Lock Cloudflare Toolchain

on:
  push:
    branches:
      - website/cloudflare-toolchain-hardening-v6-1
    paths:
      - .github/workflows/lock-cloudflare-toolchain.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: website/cloudflare-toolchain-hardening-v6-1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Lock Wrangler in project dependencies
        run: npm install --save-dev --save-exact wrangler@4.127.1

      - name: Audit complete locked dependency graph
        run: npm audit --audit-level=high

      - name: Static Astro diagnostics
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Validate generated links
        run: npm run validate:links

      - name: Commit locked Cloudflare toolchain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: lock Cloudflare Wrangler toolchain"
          git push origin HEAD:website/cloudflare-toolchain-hardening-v6-1
