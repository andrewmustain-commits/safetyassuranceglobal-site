name: Refresh Wrangler Lockfile

on:
  push:
    branches:
      - website/approved-public-cutover-20260916
    paths:
      - .github/workflows/refresh-wrangler-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Refresh Wrangler and lockfile
        run: npm install --save-dev --package-lock-only wrangler@4.133.0

      - name: Verify high-severity audit is clear
        run: npm audit --audit-level=high

      - name: Upload refreshed package files
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
