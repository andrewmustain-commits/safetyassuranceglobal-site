name: Refresh Wrangler Lockfile

on:
  push:
    branches:
      - website/approved-public-cutover-20260916
    paths:
      - .github/workflows/refresh-wrangler-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: website/approved-public-cutover-20260916

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Refresh Wrangler and lockfile
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts wrangler@4.133.0

      - name: Approve exact Workerd install script version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.allowScripts ??= {};
          for (const key of Object.keys(pkg.allowScripts)) {
            if (key.startsWith('workerd@')) delete pkg.allowScripts[key];
          }
          pkg.allowScripts['workerd@1.20260916.1'] = true;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Verify high-severity audit is clear
        run: npm audit --audit-level=high

      - name: Commit refreshed package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore: update Wrangler to audited 4.133.0"
          git push origin HEAD:website/approved-public-cutover-20260916
