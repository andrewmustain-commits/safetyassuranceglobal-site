name: Refresh Security Lockfile

on:
  push:
    branches:
      - website/security-hardening-v5
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: website/security-hardening-v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Build hardened dependency set
        run: npm run build

      - name: Validate generated links
        run: npm run validate:links

      - name: Verify audit result
        run: npm audit

      - name: Commit remediated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: apply dependency audit fixes"
          git push origin HEAD:website/security-hardening-v5
