name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate blog frontmatter governance
        run: npm run blog:validate

      - name: Validate brand assets
        run: npm run validate:brand-assets

      - name: Validate Turnstile integration
        run: npm run validate:turnstile

      - name: Static Astro diagnostics
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Validate generated links
        run: npm run validate:links

      - name: Validate structured data
        run: npm run validate:structured-data

      - name: Validate head metadata
        run: npm run validate:head

      - name: Validate publication routes
        run: npm run validate:publication-routes

      - name: Validate sitemap integrity
        run: npm run validate:sitemap

      - name: Validate public UX
        run: npm run validate:public-ux

      - name: Deploy production build to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: pages deploy dist --project-name=safetyassuranceglobal --branch=main

      - name: Verify hosted production routes
        run: node scripts/verify-production-routes.mjs
